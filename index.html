<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <!-- Seu CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- TOPO -->
    <header class="bg-white shadow-sm rounded p-3 mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap">

            <div class="d-flex align-items-center gap-3">
                <img src="logo_convertida.png" alt="Logo" width="70" class="rounded">
                <h1 class="h3 m-0">Cadastro de Cliente</h1>
            </div>

            <div class="d-flex gap-2 mt-3 mt-md-0">
                <a href="index2.html" class="btn btn-primary">Data Ship</a>
                <a href="index3.html" class="btn btn-success">Inversor</a>
                <a href="https://docs.google.com/spreadsheets/d/1W2dkSLU-TZ_CAEGyav5A7CBdJ6jY81zCcByrEsHcNEc/edit?usp=sharing"
                   target="_blank"
                   class="btn btn-dark">
                   Planilha
                </a>
            </div>

        </div>
    </header>

    <!-- FORM -->
    <form action="https://script.google.com/macros/s/AKfycbyZEnBoX9AnJqhkqabZjs9nIdztPzAioxSJbCUuTWnDEy4jdgC2iGPnZx1iHiU4DcMzqw/exec"
          method="post"
          enctype="multipart/form-data"
          autocomplete="off">

        <!-- Dados pessoais -->
        <fieldset class="border rounded p-4 bg-white mb-4">
            <legend class="float-none w-auto px-2">Dados Pessoais</legend>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Nome</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">CPF</label>
                    <input type="number"
                           name="cpf"
                           class="form-control"
                           pattern="\d{11}"
                           maxlength="11"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">RG</label>
                    <input type="text" name="rg" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Telefone</label>
                    <input type="number" name="celular" class="form-control">
                </div>

            </div>
        </fieldset>

        <!-- Endereço -->
        <fieldset class="border rounded p-4 bg-white mb-4">
            <legend class="float-none w-auto px-2">Endereço</legend>

            <div class="row g-3">

                <div class="col-md-3">
                    <label class="form-label">Rua</label>
                    <input type="text" name="rua" class="form-control">
                </div>

                <div class="col-md-5">
                    <label class="form-label">Número</label>
                    <input type="number" name="numero" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Bairro</label>
                    <input type="text" name="bairro" class="form-control">
                </div>

                               <div class="col-md-4">
                    <label class="form-label">CEP</label>
                    <input type="text" name="cep" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Cidade</label>
                    <select name="cidade" class="form-select" required>
                        <option value="">Selecione</option>
                        <option>Crato</option>
                        <option>Juazeiro do Norte</option>
                        <option>Barbalha</option>
                        <option >Moreilândia</option>
                        <option >Santana Do Cariri</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select" required>
                        <option value="">Selecione</option>
                        <option>CE</option>
                        <option>PE</option>
                        <option>BA</option>
                    </select>
                </div>

            </div>
        </fieldset>

        <!-- Outros -->
        <fieldset class="border rounded p-4 bg-white mb-4">
            <legend class="float-none w-auto px-2">Outros Dados</legend>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Unidade Gestora</label>
                    <input type="number"
                           name="unidade_gemdora"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Unidade Beneficiária</label>
                    <input type="text"
                           name="unidade_beneficiaria"
                           class="form-control">
                </div>

            </div>
        </fieldset>

        <button type="button" onclick="salvar()" class="btn btn-primary w-100">
            Próximo
        </button>

    </form>
</div>

<script>
document.addEventListener('contextmenu', event => event.preventDefault());

function salvar() {

localStorage.setItem("nome", document.querySelector("[name='nome']").value);
localStorage.setItem("cpf", document.querySelector("[name='cpf']").value);
localStorage.setItem("rg", document.querySelector("[name='rg']").value);
localStorage.setItem("email", document.querySelector("[name='email']").value);
localStorage.setItem("celular", document.querySelector("[name='celular']").value);
localStorage.setItem("rua", document.querySelector("[name='rua']").value);
localStorage.setItem("numero", document.querySelector("[name='numero']").value);
localStorage.setItem("cidade", document.querySelector("[name='cidade']").value);
localStorage.setItem("bairro", document.querySelector("[name='bairro']").value);
localStorage.setItem("estado", document.querySelector("[name='estado']").value);
localStorage.setItem("unidade_gemdora", document.querySelector("[name='unidade_gemdora']").value);
localStorage.setItem("unidade_beneficiaria", document.querySelector("[name='unidade_beneficiaria']").value);

window.location.href = "index2.html";
}
</script>

</body>
</html>
