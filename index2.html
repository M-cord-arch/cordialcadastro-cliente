<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Ship</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Seu CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- TOPO -->
    <header class="bg-white shadow-sm rounded p-3 mb-4">

        <div class="d-flex justify-content-between align-items-center flex-wrap">

            <div class="d-flex align-items-center gap-3">
                <img src="logo_convertida.png"
                     alt="Logo"
                     width="70"
                     class="rounded">

                <h1 class="h3 m-0">Cadastro de Cliente</h1>
            </div>

            <div class="d-flex gap-2 mt-3 mt-md-0">
                <a href="index.html" class="btn btn-primary">
                    Cadastro
                </a>

                <a href="index3.html" class="btn btn-success">
                    Inversor
                </a>

                <a href="https://docs.google.com/spreadsheets/d/1W2dkSLU-TZ_CAEGyav5A7CBdJ6jY81zCcByrEsHcNEc/edit?usp=sharing"
                   target="_blank"
                   class="btn btn-dark">
                   Planilha
                </a>
            </div>

        </div>

    </header>

    <!-- FORM -->
    <form action="https://script.google.com/macros/s/AKfycbwcCx2WdGz0WN5TABZuRiExOvyW-_HllYhGj6gGpATgR20OxhuOsActbCrMwsUXY5ryuQ/exec"
          method="post"
          enctype="multipart/form-data"
          autocomplete="off">

        <!-- DADOS -->
        <fieldset class="border rounded p-4 bg-white mb-4">

            <legend class="float-none w-auto px-2">
                Dados da Instalação
            </legend>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Fornecedor</label>

                    <input type="text"
                           name="fornecedor"
                           placeholder="Fornecedor"
                           class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Nota Fiscal</label>

                    <input type="text"
                           name="nota-fiscal"
                           placeholder="Nota Fiscal"
                           class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Emissão</label>

                    <input type="date"
                           name="emissao"
                           class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Instalação</label>

                    <input type="date"
                           name="instalacao"
                           class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Vistoria</label>

                    <input type="date"
                           name="vistoria"
                           class="form-control">
                </div>

            </div>

        </fieldset>

        <!-- CAMPOS OCULTOS -->
        <input type="hidden" name="nome">
        <input type="hidden" name="cpf">
        <input type="hidden" name="rg">
        <input type="hidden" name="email">
        <input type="hidden" name="celular">
        <input type="hidden" name="rua">
        <input type="hidden" name="numero">
        <input type="hidden" name="cidade">
        <input type="hidden" name="bairro">
        <input type="hidden" name="estado">
        <input type="hidden" name="unidade_gemdora">
        <input type="hidden" name="unidade_beneficiaria">

        <!-- BOTÕES -->
        <div class="d-flex gap-3">

            <input type="reset"
                   value="Limpar"
                   class="btn btn-outline-secondary w-50">

            <input type="submit"
                   value="Enviar"
                   class="btn btn-primary w-50">

        </div>

    </form>

</div>

<script>

window.onload = function() {

    document.querySelector("[name='nome']").value =
    localStorage.getItem("nome");

    document.querySelector("[name='cpf']").value =
    localStorage.getItem("cpf");

    document.querySelector("[name='rg']").value =
    localStorage.getItem("rg");

    document.querySelector("[name='email']").value =
    localStorage.getItem("email");

    document.querySelector("[name='celular']").value =
    localStorage.getItem("celular");

    document.querySelector("[name='rua']").value =
    localStorage.getItem("rua");

    document.querySelector("[name='numero']").value =
    localStorage.getItem("numero");

    document.querySelector("[name='cidade']").value =
    localStorage.getItem("cidade");

    document.querySelector("[name='bairro']").value =
    localStorage.getItem("bairro");

    document.querySelector("[name='estado']").value =
    localStorage.getItem("estado");

    document.querySelector("[name='unidade_gemdora']").value =
    localStorage.getItem("unidade_gemdora");

    document.querySelector("[name='unidade_beneficiaria']").value =
    localStorage.getItem("unidade_beneficiaria");

}

</script>

</body>
</html>
